<script>
        const API_BASE = "https://sanand-truck.onrender.com";
        let html5QrCode = null;
        let isScanning = false;

        function switchTab(tab) {
            document.getElementById('tab-scan').classList.toggle('active', tab === 'scan');
            document.getElementById('tab-lookup').classList.toggle('active', tab === 'lookup');
            document.getElementById('view-scan').style.display = tab === 'scan' ? 'block' : 'none';
            document.getElementById('view-lookup').style.display = tab === 'lookup' ? 'block' : 'none';
            if (tab !== 'scan') stopCamera();
        }

        async function startCamera() {
            const readerDiv = document.getElementById("reader");
            readerDiv.innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <button id="btn-start-cam" class="btn-neon" onclick="activateRearCamera()">
                        📷 Attiva Fotocamera Posteriore
                    </button>
                    <p id="cam-error" style="color: #fb7185; font-size: 0.8rem; margin-top: 10px;"></p>
                </div>
            `;
        }

        async function activateRearCamera() {
            const errText = document.getElementById("cam-error");
            const btn = document.getElementById("btn-start-cam");
            if (btn) btn.innerText = "Apertura fotocamera in corso...";

            try {
                // Verifica supporto browser
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Il browser blocca la fotocamera. Apri il link con Chrome o Safari (non dentro WhatsApp/Telegram).");
                }

                html5QrCode = new Html5Qrcode("reader");
                isScanning = true;

                await html5QrCode.start(
                    { facingMode: "environment" }, // Forza fotocamera posteriore
                    {
                        fps: 12,
                        qrbox: { width: 260, height: 150 },
                        aspectRatio: 1.5
                    },
                    (decodedText) => {
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopCamera().then(() => processSupplierCode(decodedText));
                    },
                    (errorMessage) => {
                        // Ignora errori continui di frame vuoti
                    }
                );
            } catch (err) {
                isScanning = false;
                startCamera();
                setTimeout(() => {
                    const e = document.getElementById("cam-error");
                    if (e) e.innerText = "⚠️ " + (err.message || "Permesso fotocamera negato. Controlla le impostazioni del browser.");
                }, 100);
            }
        }

        async function stopCamera() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) {}
                isScanning = false;
            }
        }

        async function processSupplierCode(code) {
            if (!code || !code.trim()) return;
            try {
                const res = await fetch(`${API_BASE}/api/barcode/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ supplier_barcode: code.trim() })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Errore server");

                document.getElementById("res-supplier").innerText = data.supplier;
                document.getElementById("res-supplier-code").innerText = "Tracking Originale: " + data.supplier_barcode;
                document.getElementById("res-customer").innerText = data.customer;
                document.getElementById("res-address").innerText = data.address;

                JsBarcode("#company-barcode", data.sanand_barcode, {
                    format: "CODE128",
                    lineColor: "#000000",
                    width: 2.2,
                    height: 75,
                    displayValue: true,
                    fontSize: 16,
                    fontOptions: "bold"
                });

                document.getElementById("scanner-area").style.display = "none";
                document.getElementById("generated-area").style.display = "block";
            } catch (err) {
                alert("Errore collegamento API: " + err.message);
                startCamera();
            }
        }

        function resetScanView() {
            document.getElementById("generated-area").style.display = "none";
            document.getElementById("scanner-area").style.display = "block";
            document.getElementById("manual-supplier-code").value = "";
            activateRearCamera();
        }

        async function lookupCode() {
            const code = document.getElementById("lookup-input").value.trim();
            const box = document.getElementById("lookup-result");
            if (!code) return;

            box.innerHTML = '<p style="color:var(--neon-teal); font-size:0.85rem;">Ricerca nel database...</p>';
            try {
                const res = await fetch(`${API_BASE}/api/barcode/lookup/${encodeURIComponent(code)}`);
                const d = await res.json();
                if (!res.ok) {
                    box.innerHTML = `<p style="color:#fb7185; font-size:0.85rem;">❌ ${d.detail}</p>`;
                    return;
                }
                box.innerHTML = `
                    <div class="detail-row">
                        <div class="detail-label">Codice SanAnd TRUCK</div>
                        <strong style="color:var(--neon-teal); font-size:1rem;">${d.sanand_barcode || 'Non ancora generato'}</strong>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Fornitore & Codice Originale</div>
                        <strong>${d.supplier || 'N/D'}</strong> — <span>${d.supplier_barcode}</span>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Mittente</div>
                        <div>${d.sender_name || 'N/D'}</div>
                        <div style="color:var(--text-secondary); font-size:0.78rem;">${d.sender_address || ''}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Destinatario</div>
                        <strong>${d.customer_name}</strong> ${d.customer_phone ? '• ' + d.customer_phone : ''}
                        <div style="color:var(--text-secondary); font-size:0.78rem;">${d.delivery_address}</div>
                    </div>
                `;
            } catch (e) {
                box.innerHTML = '<p style="color:#fb7185; font-size:0.85rem;">Errore di connessione al server.</p>';
            }
        }

        // Mostra subito il pulsante di attivazione fotocamera
        startCamera();
    </script>
