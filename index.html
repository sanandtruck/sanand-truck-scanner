<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanAnd TRUCK // Laser & Scanner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071112">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #071112;
            --bg-bottom: #0c1f20;
            --card-bg: rgba(11, 26, 28, 0.92);
            --input-bg: #081415;
            --neon-teal: #2ee6d6;
            --neon-border: rgba(46, 230, 214, 0.45);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 0%, #102a2c 0%, var(--bg-top) 50%, var(--bg-bottom) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 1.5rem 1rem 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 1.3rem; }
        .brand-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #a7f3d0;
            text-shadow: 0 0 14px rgba(46, 230, 214, 0.45);
        }
        .brand-title span { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; font-size: 1.5rem; }
        .subtitle {
            color: var(--neon-teal);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 1.2rem;
        }
        .tab-btn {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            border: 1px solid var(--neon-border);
            background: var(--input-bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: rgba(46, 230, 214, 0.16);
            color: #ffffff;
            border-color: var(--neon-teal);
            box-shadow: 0 0 15px rgba(46, 230, 214, 0.25);
        }

        .neon-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--neon-border);
            border-radius: 20px;
            padding: 1.3rem;
            box-shadow: 0 0 22px rgba(46, 230, 214, 0.14);
        }

        .laser-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(46, 230, 214, 0.08);
            border: 1px solid var(--neon-border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #a7f3d0;
            margin-bottom: 12px;
        }
        .dot-live {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ee6d6;
            box-shadow: 0 0 8px #2ee6d6;
            display: inline-block;
            margin-right: 6px;
        }

        .input-group { display: flex; gap: 8px; }
        input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1.5px solid var(--neon-teal);
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 0 12px rgba(46, 230, 214, 0.18);
        }
        .btn-neon {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--neon-teal);
            background: linear-gradient(135deg, rgba(46, 230, 214, 0.25), rgba(13, 148, 136, 0.4));
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-outline {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--neon-border);
            background: transparent;
            color: var(--neon-teal);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--neon-border);
            margin-top: 12px;
            display: none;
        }

        .barcode-box {
            background: #ffffff;
            padding: 14px 8px;
            border-radius: 14px;
            text-align: center;
            margin: 1rem 0;
            box-shadow: 0 0 18px rgba(46, 230, 214, 0.35);
        }
        svg#company-barcode { width: 100%; max-width: 320px; height: auto; }

        .detail-row {
            background: var(--input-bg);
            border: 1px solid rgba(46, 230, 214, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .detail-label {
            color: var(--neon-teal);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">SanAnd <span>TRUCK</span></div>
        <div class="subtitle">LETTORE LASER & CODICE DIGITALE</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-scan" onclick="switchTab('scan')">🔫 Lettura Laser</button>
        <button class="tab-btn" id="tab-lookup" onclick="switchTab('lookup')">🔍 Cerca Codice SAT</button>
    </div>

    <!-- SEZIONE 1: PISTOLA LASER / FOTOCAMERA -->
    <div class="neon-card" id="view-scan">
        <div class="laser-status">
            <span><span class="dot-live"></span>Pistola Laser Pronta (Auto-Invio)</span>
            <span style="font-size:0.72rem; opacity:0.8;">HID MODE</span>
        </div>

        <div class="input-group">
            <input type="text" id="laser-input" placeholder="Spara il barcode del fornitore..." autofocus autocomplete="off">
            <button class="btn-neon" onclick="triggerManualScan()">OK</button>
        </div>

        <button class="btn-outline" id="toggle-cam-btn" onclick="toggleCamera()">📷 Usa Fotocamera Telefono</button>
        <div id="reader"></div>

        <!-- RISULTATO BARCODE GENERATO (RIMANE PRONTO PER IL PROSSIMO SPARO) -->
        <div id="generated-area" style="display:none; margin-top: 1.2rem; border-top: 1px solid rgba(46,230,214,0.2); padding-top: 1rem;">
            <div class="detail-row">
                <div class="detail-label">Fornitore Rilevato</div>
                <strong id="res-supplier" style="color:#fff; font-size:1rem;">---</strong>
                <div style="color:var(--text-secondary); font-size:0.8rem;" id="res-supplier-code">---</div>
            </div>

            <div class="barcode-box">
                <svg id="company-barcode"></svg>
            </div>

            <div class="detail-row">
                <div class="detail-label">Destinatario Associato</div>
                <div id="res-customer" style="font-weight:600;">---</div>
                <div id="res-address" style="color:var(--text-secondary); font-size:0.8rem;">---</div>
            </div>
        </div>
    </div>

    <!-- SEZIONE 2: RICERCA INVERSA (DA CODICE SANAND A FORNITORE) -->
    <div class="neon-card" id="view-lookup" style="display:none;">
        <div class="detail-label" style="margin-bottom:6px;">Spara o digita Codice SanAnd (SAT-...)</div>
        <div class="input-group">
            <input type="text" id="lookup-input" placeholder="Es. SAT-261116-0001" autocomplete="off">
            <button class="btn-neon" onclick="lookupCode()">Cerca</button>
        </div>
        <div id="lookup-result" style="margin-top: 1rem;"></div>
    </div>

    <script>
        const API_BASE = "https://sanand-truck.onrender.com";
        const laserInput = document.getElementById("laser-input");
        const lookupInput = document.getElementById("lookup-input");
        let cameraActive = false;
        let scannerInstance = null;

        // Mantiene sempre il focus pronto per la pistola laser nella scheda attiva
        document.addEventListener("click", (e) => {
            if (e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
                if (document.getElementById("view-scan").style.display !== "none") {
                    laserInput.focus();
                } else {
                    lookupInput.focus();
                }
            }
        });

        // Intercetta il tasto INVIO automatico inviato dalla pistola laser
        laserInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                const code = laserInput.value.trim();
                laserInput.value = ""; // Svuota subito per il pacco successivo
                if (code) processSupplierCode(code);
            }
        });

        lookupInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                lookupCode();
            }
        });

        function triggerManualScan() {
            const code = laserInput.value.trim();
            laserInput.value = "";
            if (code) processSupplierCode(code);
            laserInput.focus();
        }

        function switchTab(tab) {
            document.getElementById('tab-scan').classList.toggle('active', tab === 'scan');
            document.getElementById('tab-lookup').classList.toggle('active', tab === 'lookup');
            document.getElementById('view-scan').style.display = tab === 'scan' ? 'block' : 'none';
            document.getElementById('view-lookup').style.display = tab === 'lookup' ? 'block' : 'none';

            if (tab === 'scan') {
                laserInput.focus();
            } else {
                lookupInput.value = "";
                lookupInput.focus();
            }
        }

        async function processSupplierCode(code) {
            try {
                const res = await fetch(`${API_BASE}/api/barcode/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ supplier_barcode: code })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Errore server");

                document.getElementById("res-supplier").innerText = data.supplier;
                document.getElementById("res-supplier-code").innerText = "Tracking Originale: " + data.supplier_barcode;
                document.getElementById("res-customer").innerText = data.customer;
                document.getElementById("res-address").innerText = data.address;

                JsBarcode("#company-barcode", data.sanand_barcode, {
                    format: "CODE128",
                    lineColor: "#000000",
                    width: 2.2,
                    height:
