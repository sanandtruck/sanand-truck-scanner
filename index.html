<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SanAnd TRUCK // Scanner & Lookup</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050d0e">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Librerie Scanner Fotocamera e Generatore Barcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <style>
        :root {
            --bg-abyssal: #040b0c;
            --bg-petrol: #09181a;
            --card-bg: rgba(11, 28, 30, 0.85);
            --neon-cyan: #2ee6d6;
            --neon-cyan-dim: rgba(46, 230, 214, 0.22);
            --neon-cyan-glow: rgba(46, 230, 214, 0.55);
            --text-main: #e6f7f6;
            --text-muted: #7aa3a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-abyssal);
            background-image: 
                radial-gradient(circle at 50% 0%, #0e2c30 0%, transparent 60%),
                radial-gradient(circle at 85% 90%, #071e21 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 460px;
        }

        /* --- LOGO METALLICO LUCIDO ANIMATO --- */
        .brand-header {
            text-align: center;
            padding: 10px 0 18px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            width: 110px;
            height: 75px;
            filter: drop-shadow(0 0 10px rgba(46, 230, 214, 0.45));
            animation: logoPulse 3.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(46, 230, 214, 0.4)); }
            50% { filter: drop-shadow(0 0 18px rgba(46, 230, 214, 0.85)); }
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gear-spin {
            transform-origin: 55px 37px;
            animation: slowRotate 18s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-top: 4px;
            background: linear-gradient(90deg, #7aa3a0 0%, #ffffff 30%, #2ee6d6 50%, #ffffff 70%, #7aa3a0 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metalShine 3.2s linear infinite;
        }

        @keyframes metalShine {
            to { background-position: 200% center; }
        }

        .brand-subtitle {
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-top: 2px;
            opacity: 0.85;
        }

        /* --- NAVIGAZIONE TAB --- */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(5, 13, 14, 0.9);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--neon-cyan-dim);
            margin-bottom: 16px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
